<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clima en Medellín</title>
  <link rel="stylesheet" href="ejercicio3.css" />
</head>
<body>
  <div class="container">
    <h1>El Clima Actual en Medellín</h1>
    <img src="images/Medellin-view-1024x768.webp" alt="">
    <div id="loader">Cargando clima...</div>
    <div id="weather-container">
      <p id="hora-actual"></p>
      <p id="weather-info"></p>
      <button id="actualizar-btn">🔄Actualizar clima</button>
    </div>
    <div id="error-container" class="hidden">
      <p id="error-message"></p>
    </div>
  </div>
  <script type="module" src="ejercicio3.js"></script>
</body>
</html>
